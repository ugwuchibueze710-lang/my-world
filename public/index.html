<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Hive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
</head>
<body>
  <div id="scene"></div>

  <header id="hud">
    <div class="brand">NEON<span>HIVE</span></div>
    <div class="stats">
      <div><b id="s-level">1</b><small>LEVEL</small></div>
      <div><b id="s-minds">1</b><small>MINDS</small></div>
      <div><b id="s-solved">0</b><small>SOLVED</small></div>
      <div><b id="s-failed">0</b><small>FAILED</small></div>
      <div><b id="s-assists">0</b><small>YOUR ASSISTS</small></div>
    </div>
    <div id="mode"></div>
  </header>

  <section id="puzzle">
    <div class="p-head"><span id="p-level">LEVEL 1</span><span id="p-title">—</span></div>
    <pre id="p-prompt">Connecting to the hive…</pre>
    <div id="p-hint"></div>
    <div id="p-answer"></div>
    <div class="timer"><div id="p-timer"></div></div>
    <div id="p-tried"></div>
  </section>

  <aside id="feed"><h3>HIVE LOG</h3><ul id="feed-list"></ul></aside>

  <form id="help" autocomplete="off">
    <label for="help-input">HELP THE HIVE</label>
    <input id="help-input" maxlength="80" placeholder="Know the answer? Type it here…">
    <button type="submit">TRANSMIT</button>
    <div id="help-result"></div>
  </form>

  <div id="splash"><div><h1>NEON<span>HIVE</span></h1><p>One AI. Every puzzle it solves, it copies itself.<br>The puzzles get harder. The hive gets bigger.</p><button id="enter">ENTER</button></div></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
