<!doctype html><html><head><meta charset="utf-8"><title>Ruler</title>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
<style>body{margin:0;background:#9fb7cf}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const W = 1800, Hh = 700; const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, Hh); r.setPixelRatio(1); r.outputColorSpace = THREE.SRGBColorSpace; r.setScissorTest(true);
document.body.appendChild(r.domElement);
const names = ['king', 'queen', 'armored-knight', 'farmer', 'viking', 'man', 'woman', 'elderly-man', 'elderly-woman', 'teen-character', 'child', 'baby-character'];
const L = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder); const gl = await Promise.all(names.map((n) => L.loadAsync(`/assets/characters/g3d/${n}.glb`)));
gl.forEach((g, i) => {
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fb7cf);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x666655, 3)); scene.add(g.scene); g.scene.updateMatrixWorld(true);
  let head; g.scene.traverse((o) => { if (o.isBone && o.name === 'Head') head = o; });
  const hp = head.getWorldPosition(new THREE.Vector3());
  // ruler lines every 2cm above the head bone, every 10cm red
  for (let k = -2; k <= 16; k++) { const m = new THREE.Mesh(new THREE.PlaneGeometry(0.4, k % 5 === 0 ? 0.0025 : 0.0012), new THREE.MeshBasicMaterial({ color: k % 5 === 0 ? 0xff0000 : 0x00ffff, depthTest: false })); m.position.set(hp.x + 0.2, hp.y + k * 0.02, 1); m.renderOrder = 9; scene.add(m); }
  const cam = new THREE.OrthographicCamera(-0.16, 0.16, 0.2, -0.08, 0.01, 10); cam.position.set(hp.x, hp.y + 0.06, hp.z + 3); cam.lookAt(hp.x, hp.y + 0.06, hp.z);
  // scale ruler half width covers left side only
  const x = (i % 6) * W / 6, y = Math.floor(i / 6) * Hh / 2;
  r.setViewport(x, Hh / 2 - y, W / 6, Hh / 2); r.setScissor(x, Hh / 2 - y, W / 6, Hh / 2); r.render(scene, cam);
});
document.title = 'done';
</script></body></html>
