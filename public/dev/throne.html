<!doctype html><html><head><meta charset="utf-8"><title>Throne</title>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
<style>body{margin:0}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { retargetClips } from '/js/retarget.js';
const q = new URLSearchParams(location.search);
const T = { scale: 1.3, rot: +(q.get('rot') ?? 0), seatY: +(q.get('y') ?? 0), back: +(q.get('b') ?? 0) };
const L = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const [ual, tgt, chair] = await Promise.all([L.loadAsync('/assets/characters/human.glb'), L.loadAsync('/assets/characters/g3d/king.glb'), L.loadAsync('/assets/world/chair.glb')]);
const clips = retargetClips(SkeletonUtils.clone(ual.scene), ual.animations.filter((c) => c.name === 'Sitting_Idle_Loop'), SkeletonUtils.clone(tgt.scene));
const W = 1200, H = 600; const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; r.setScissorTest(true); document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fb7cf);
scene.add(new THREE.HemisphereLight(0xffffff, 0x666655, 2.5)); const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(3, 5, 4); scene.add(sun);
const grid = new THREE.GridHelper(4, 16); scene.add(grid);
const c = chair.scene; c.scale.setScalar(T.scale); c.rotation.y = T.rot; c.position.z = -T.back; scene.add(c);
const k = tgt.scene; k.position.y = T.seatY; k.position.z = -T.back * 0; scene.add(k);
const mixer = new THREE.AnimationMixer(k); mixer.clipAction(clips[0]).play(); mixer.update(0.5);
// mark the character's facing (+z) with a red arrow
scene.add(new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0.05, 0), 1, 0xff0000));
const cams = [[new THREE.Vector3(4, 1, 0)], [new THREE.Vector3(2.5, 1.6, 3.5)]];
cams.forEach(([p], i) => { const cam = new THREE.PerspectiveCamera(30, (W / 2) / H, 0.1, 50); cam.position.copy(p); cam.lookAt(0, 0.7, 0); r.setViewport(i * W / 2, 0, W / 2, H); r.setScissor(i * W / 2, 0, W / 2, H); r.render(scene, cam); });
document.title = 'done';
</script></body></html>
