<!doctype html><html><head><meta charset="utf-8"><title>Character test</title>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
<style>body{margin:0;background:#9fb7cf;font:13px sans-serif}#info{position:fixed;left:10px;top:10px;background:#fff;padding:6px}</style></head><body><div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { Characters } from '/js/characters.js';
// Development page: renders a lineup of agents through the real character layer.
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(1); r.shadowMap.enabled = true;
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fb7cf);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 200);
const q = new URLSearchParams(location.search);
const zoom = +(q.get('zoom') || 1);
const cx = +(q.get('x') || 0); cam.position.set(cx, 1.5 + (zoom > 2 ? 0.15 : 0), 9 / zoom); cam.lookAt(cx, 1.0 + (zoom > 2 ? 0.6 : 0), 0);
scene.add(new THREE.HemisphereLight(0xdfefff, 0x554433, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.4); sun.position.set(3, 6, 5); sun.castShadow = true; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x5f7a3a })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const world = { heightAt: () => 0, gridHeight: () => 0 };
const kc = new Map([[1, new THREE.Color('#c0392b')], [2, new THREE.Color('#2e6fd8')]]);
// agents with the exact fields the simulation stream provides
const mk = (id, x, k, female, ageG, role, st, mood, extra = {}) => ({ id, x, z: 0, y: 0, k, fl: female | (ageG << 1) | (role << 3), st, ex: mood << 2, age: ageG === 1 ? 9 : 30, hd: 0, mv: false, ph: id, ...extra });
const agents = [
  mk(1, -3.2, 1, 0, 2, 2, 0, 1), mk(2, -1.9, 1, 1, 2, 3, 0, 1), mk(3, -0.6, 2, 0, 2, 1, 8, 3), mk(4, 0.7, 2, 1, 2, 0, 2, 0),
  mk(5, 1.9, 1, 0, 3, 0, 0, 2), mk(6, 2.9, 2, 1, 1, 0, 11, 1), mk(7, 3.9, 1, 0, 2, 0, 0, 4),
];
const people = { list: agents, agents: new Map(agents.map((a) => [a.id, a])), kColors: kc };
const chars = new Characters(scene, world, people, () => {});
const clock = new THREE.Clock(); let t = 0;
const st = q.get('state');
function loop() {
  const dt = Math.min(0.05, clock.getDelta()); t += dt;
  for (const a of agents) { if (st) a.st = +st; a.mouthUntil = a.id === 2 ? performance.now() + 1000 : 0; }
  chars.update(dt, performance.now(), t, cam, new THREE.Vector3(0, 0, 0));
  document.getElementById('info').textContent = `ready=${chars.ready} slots=${chars.slots.length} anims=${chars.slots.map(s => s.current?.getClip().name).join(',')}`;
  r.render(scene, cam); requestAnimationFrame(loop);
}
loop();
</script></body></html>
