<!doctype html><html><head><meta charset="utf-8"><title>Retarget test</title>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
<style>body{margin:0;background:#9fb7cf;font:13px sans-serif}#info{position:fixed;left:10px;top:10px;background:#fff;padding:6px}</style></head><body><div id="info">loading</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { retargetClips } from '/js/retarget.js';
const q = new URLSearchParams(location.search);
const model = q.get('m') || 'king', t = +(q.get('t') || 0.6);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(1); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fb7cf);
scene.add(new THREE.HemisphereLight(0xffffff, 0x666655, 2.2)); const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(2, 5, 6); scene.add(sun);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100); cam.position.set(0, 1.4, 11); cam.lookAt(0, 0.9, 0);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x6f8a4a })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const L = new GLTFLoader();
const [ual, tgt] = await Promise.all([L.loadAsync('/assets/characters/human.glb'), L.loadAsync(`/assets/characters/g3d/${model}.glb`)]);
const names = (q.get('a') || 'Idle_Loop,Walk_Loop,Sword_Attack,Sitting_Idle_Loop,Fixing_Kneeling').split(',');
const src = SkeletonUtils.clone(ual.scene);
const probe = SkeletonUtils.clone(tgt.scene);
const t0 = performance.now();
const clips = retargetClips(src, names.map((n) => ual.animations.find((c) => c.name === n)), probe);
const mixers = [];
names.forEach((n, i) => {
  const c = SkeletonUtils.clone(tgt.scene); c.position.x = (i - (names.length - 1) / 2) * 1.6; scene.add(c);
  const m = new THREE.AnimationMixer(c); const a = m.clipAction(clips[i]); a.play(); m.setTime(clips[i].duration * t); mixers.push(m);
});
document.getElementById('info').textContent = `${model}: ${names.join(' | ')} — retarget ${Math.round(performance.now() - t0)}ms`;
r.render(scene, cam);
</script></body></html>
