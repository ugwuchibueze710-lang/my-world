<!doctype html><html><head><meta charset="utf-8"><title>Mouth</title>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
<style>body{margin:0;background:#9fb7cf}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { findMouth, attachMouth } from '/js/mouth.js';
const q = new URLSearchParams(location.search);
const open = +(q.get('o') ?? 0.8);
const W = 1500, Hh = 560; const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, Hh); r.setPixelRatio(1); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.setScissorTest(true);
document.body.appendChild(r.domElement);
const names = ['king', 'queen', 'armored-knight', 'farmer', 'viking', 'man', 'woman', 'elderly-man', 'elderly-woman', 'teen-character', 'child', 'baby-character'];
const L = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder); const gl = await Promise.all(names.map((n) => L.loadAsync(`/assets/characters/g3d/${n}.glb`)));
const info = [];
gl.forEach((g, i) => {
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fb7cf);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x666655, 2.4)); const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(2, 5, 6); scene.add(sun);
  scene.add(g.scene); const mi = findMouth(g.scene, names[i]); const c = attachMouth(g.scene, mi); c?.set(open, i % 5, 1); g.scene.updateMatrixWorld(true);
  info.push(names[i] + JSON.stringify(mi && [mi.pos.x.toFixed(3), mi.pos.y.toFixed(3), mi.pos.z.toFixed(3), mi.head]));
  const cam = new THREE.PerspectiveCamera(20, (W / 6) / (Hh / 2), 0.01, 50);
  const p = mi ? mi.pos : new THREE.Vector3(0, 1.5, 0); const d = 0.9;
  cam.position.set(p.x + d * 0.25, p.y + 0.02, p.z + d); cam.lookAt(p.x, p.y + 0.02, p.z);
  const x = (i % 6) * W / 6, y = Math.floor(i / 6) * Hh / 2;
  r.setViewport(x, Hh / 2 - y, W / 6, Hh / 2); r.setScissor(x, Hh / 2 - y, W / 6, Hh / 2); r.render(scene, cam);
});
console.log(info.join(' ')); document.title = 'done';
</script></body></html>
