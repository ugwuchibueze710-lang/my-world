<!doctype html><html><head><meta charset="utf-8"><title>Lineup</title>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
<style>body{margin:0;background:#9fb7cf;font:12px sans-serif}.l{position:fixed;top:12px;color:#000;transform:translateX(-50%)}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(1); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fb7cf);
scene.add(new THREE.HemisphereLight(0xffffff, 0x666655, 2.4)); const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(2, 5, 6); scene.add(sun);
const cam = new THREE.PerspectiveCamera(22, innerWidth / innerHeight, 0.1, 100); cam.position.set(0, 1.1, 22); cam.lookAt(0, 0.95, 0);
const names = ['king', 'queen', 'armored-knight', 'farmer', 'viking', 'man', 'woman', 'elderly-man', 'elderly-woman', 'teen-character', 'child', 'baby-character'];
const L = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const gl = await Promise.all(names.map((n) => L.loadAsync(`/assets/characters/g3d/${n}.glb`)));
gl.forEach((g, i) => { const x = (i - (names.length - 1) / 2) * 1.3; g.scene.position.x = x; scene.add(g.scene);
  const d = document.createElement('div'); d.className = 'l'; d.textContent = names[i]; const v = new THREE.Vector3(x, 2.2, 0).project(cam); d.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; document.body.appendChild(d); });
r.render(scene, cam); document.title = 'done';
</script></body></html>
